[paths]
train = "train.spacy"
dev = "dev.spacy"
vectors = "../vectors"
init_tok2vec = null
raw_text = null

[system]
gpu_allocator = null
seed = 0

[nlp]
lang = "fr"
pipeline = ["commecy_normalizer","jusqucy_normalizer","pretagger_hunspell","morphologizer","parser"]
batch_size = 1000
disabled = []
before_creation = null
after_creation = null
after_pipeline_creation = null
tokenizer = {"@tokenizers":"jusqucy_tokenizer"}
vectors = {"@vectors":"spacy.Vectors.v1"}

[components]

[components.jusqucy_normalizer]
source = ${components.morphologizer.source}
component = "jusqucy_normalizer"

[components.commecy_normalizer]
source = ${components.morphologizer.source}
component = "commecy_normalizer"

[components.pretagger_hunspell]
factory = "pretagger_hunspell"
dic = {"@misc": "solipcysme_dic"}
aff = {"@misc": "solipcysme_aff"}
ext_names = ["hunspell_po", "hunspell_is"]
prefixes = ["po:", "is:"]
add_dics = []

[components.morphologizer]
source = null
component = "morphologizer"

[components.parser]
factory = "parser"

[components.parser.model]
@architectures = "spacy.TransitionBasedParser.v2"
state_type = "parser"
extra_state_tokens = false
hidden_width = 128
maxout_pieces = 3
use_upper = true
nO = null

[components.parser.model.tok2vec]
@architectures = "spacy.Tok2Vec.v2"

[components.parser.model.tok2vec.embed]
@architectures = "SolipcysmeMultiHash"
width = ${components.parser.model.tok2vec.encode.width}
features = ["NORM","POS", "MORPH", "LEMMA"]
u_features = []
rows = [4000, 2000, 4000, 2000]
include_static_vectors = true

[components.parser.model.tok2vec.encode]
@architectures = "spacy.MaxoutWindowEncoder.v2"
width = 128
depth = 4
window_size = 1
maxout_pieces = 3

[corpora]

[corpora.dev]
@readers = "spacy.Corpus.v1"
path = ${paths.dev}
max_length = 0
gold_preproc = false
limit = 0
augmenter = null

[corpora.train]
@readers = "spacy.Corpus.v1"
path = ${paths.train}
max_length = 0
gold_preproc = false
limit = 0
augmenter = null

[training]
dev_corpus = "corpora.dev"
train_corpus = "corpora.train"
seed = ${system.seed}
gpu_allocator = ${system.gpu_allocator}
dropout = 0.1
accumulate_gradient = 1
patience = 1600
max_epochs = 20
max_steps = 20000
eval_frequency = 200
annotating_components = ["commecy_normalizer","jusqucy_normalizer","pretagger_hunspell","morphologizer"]
frozen_components = ["commecy_normalizer","jusqucy_normalizer","pretagger_hunspell","morphologizer"]
before_to_disk = null
before_update = null

[training.batcher]
@batchers = "spacy.batch_by_words.v1"
discard_oversize = false
tolerance = 0.2
get_length = null

[training.batcher.size]
@schedules = "compounding.v1"
start = 100
stop = 1000
compound = 1.001
t = 0.0

[training.logger]
@loggers = "spacy.ConsoleLogger.v1"
progress_bar = false

[training.optimizer]
@optimizers = "Adam.v1"
beta1 = 0.9
beta2 = 0.999
L2_is_weight_decay = true
L2 = 0.01
grad_clip = 1.0
use_averages = false
eps = 0.00000001
learn_rate = 0.001

[training.score_weights]
pos_acc = null
morph_acc = null
morph_per_feat = null

[initialize]
vectors = ${paths.vectors}
init_tok2vec = ${paths.init_tok2vec}
vocab_data = null
lookups = null
before_init = null
after_init = null

[initialize.components]

[initialize.components.parser]

[initialize.components.parser.labels]
@readers = "spacy.read_labels.v1"
path = "../labels/parser.json"
require = false

[initialize.tokenizer]
