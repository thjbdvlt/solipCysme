[paths]
train = null
dev = null
vectors = null
init_tok2vec = null
raw_text = "../data/raw.txt"

[system]
gpu_allocator = null
seed = 0

[nlp]
lang = "fr"
pipeline = ["jusqucy_typifier","commecy_normalizer","jusqucy_normalizer","pretagger_hunspell","morphologizer"]
batch_size = 1000
disabled = []
before_creation = null
after_creation = null
after_pipeline_creation = null
vectors = {"@vectors":"spacy.Vectors.v1"}

[nlp.tokenizer]
@tokenizers = "jusqucy_tokenizer"
ext_token_ttype = "ttype"
ext_token_isword = "isword"

[components]

[components.commecy_normalizer]
factory = "commecy_normalizer"

[components.jusqucy_normalizer]
factory = "jusqucy_normalizer"

[components.jusqucy_typifier]
factory = "jusqucy_typifier"

[components.morphologizer]
factory = "morphologizer"
extend = false
label_smoothing = 0.05
overwrite = true
scorer = {"@scorers":"spacy.morphologizer_scorer.v1"}

[components.morphologizer.model]
@architectures = "spacy.Tagger.v2"
nO = null
normalize = false

[components.morphologizer.model.tok2vec]
@architectures = "spacy.Tok2Vec.v2"

[components.morphologizer.model.tok2vec.embed]
@architectures = "SolipcysmeMultiHash"
width = ${components.morphologizer.model.tok2vec.encode.width}
features = ["NORM"]
u_features = ["jusqucy_ttypes","hunspell_po","hunspell_is"]
rows = [4000,1000,2000,4000]
include_static_vectors = true

[components.morphologizer.model.tok2vec.encode]
@architectures = "spacy.MaxoutWindowEncoder.v2"
width = 256
depth = 4
window_size = 1
maxout_pieces = 3

[components.pretagger_hunspell]
factory = "pretagger_hunspell"
add_dics = []
dic = {"@misc": "solipcysme_dic"}
aff = {"@misc": "solipcysme_aff"}
ext_names = ["hunspell_po","hunspell_is"]
prefixes = ["po:","is:"]
string_empty = ""
string_oov = "/"

[corpora]

[corpora.dev]
@readers = "spacy.Corpus.v1"
path = ${paths.dev}
max_length = 0
gold_preproc = false
limit = 0
augmenter = null

[corpora.pretrain]
@readers = "spacy.PlainTextCorpus.v1"
path = "../data/raw.txt"
min_length = 0
max_length = 0

[corpora.train]
@readers = "spacy.Corpus.v1"
path = ${paths.train}
max_length = 0
gold_preproc = false
limit = 0
augmenter = null

[training]
dev_corpus = "corpora.dev"
train_corpus = "corpora.train"
seed = ${system.seed}
gpu_allocator = ${system.gpu_allocator}
dropout = 0.1
accumulate_gradient = 1
patience = 1600
max_epochs = 10
max_steps = 20000
eval_frequency = 200
annotating_components = ["commecy_normalizer","jusqucy_normalizer"]
frozen_components = ["commecy_normalizer","jusqucy_normalizer"]
before_to_disk = null
before_update = null

[training.batcher]
@batchers = "spacy.batch_by_words.v1"
discard_oversize = false
tolerance = 0.2
get_length = null

[training.batcher.size]
@schedules = "compounding.v1"
start = 100
stop = 1000
compound = 1.001
t = 0.0

[training.logger]
@loggers = "spacy.ConsoleLogger.v1"
progress_bar = false

[training.optimizer]
@optimizers = "Adam.v1"
beta1 = 0.9
beta2 = 0.999
L2_is_weight_decay = true
L2 = 0.01
grad_clip = 1.0
use_averages = false
eps = 0.00000001
learn_rate = 0.001

[training.score_weights]
pos_acc = 0.5
morph_acc = 0.5
morph_per_feat = null

[pretraining]
max_epochs = 1
dropout = 0.2
n_save_every = null
n_save_epoch = null
component = "morphologizer"
layer = "tok2vec"
corpus = "corpora.pretrain"

[pretraining.batcher]
@batchers = "spacy.batch_by_words.v1"
size = 3000
discard_oversize = false
tolerance = 0.2
get_length = null

[pretraining.objective]

[pretraining.optimizer]
@optimizers = "Adam.v1"
beta1 = 0.9
beta2 = 0.999
L2_is_weight_decay = true
L2 = 0.01
grad_clip = 1.0
use_averages = true
eps = 0.00000001
learn_rate = 0.001

[initialize]
vectors = ${paths.vectors}
init_tok2vec = ${paths.init_tok2vec}
vocab_data = null
lookups = null
before_init = null
after_init = null

[initialize.components]

[initialize.components.morphologizer]

[initialize.components.morphologizer.labels]
@readers = "spacy.read_labels.v1"
path = "../labels/morphologizer.json"
require = false

[initialize.tokenizer]
