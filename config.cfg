[nlp]
lang = "fr"
pipeline = ["commecy_normalizer","jusqucy_normalizer","pretagger_hunspell","morphologizer","parser","viceverser_lemmatizer"]
batch_size = 1000
disabled = []
before_creation = null
after_creation = null
after_pipeline_creation = null
vectors = {"@vectors":"spacy.Vectors.v1"}

[nlp.tokenizer]
@tokenizers = "jusqucy_tokenizer"
ext_name_token = "ttype"

[components]

[components.commecy_normalizer]
factory = "commecy_normalizer"

[components.jusqucy_normalizer]
factory = "jusqucy_normalizer"

[components.pretagger_hunspell]
factory = "pretagger_hunspell"
ext_names = ["hunspell_po","hunspell_is"]
prefixes = ["po:","is:"]
dic = {"@misc":"solipcysme_dic"}
aff = {"@misc":"solipcysme_aff"}
add_dics = []
string_empty = ""
string_oov = "/"

[components.morphologizer]
factory = "morphologizer"
extend = false
label_smoothing = 0.05
overwrite = true
scorer = {"@scorers":"spacy.morphologizer_scorer.v1"}

[components.morphologizer.model]
@architectures = "spacy.Tagger.v2"
nO = null
normalize = false

[components.morphologizer.model.tok2vec]
@architectures = "spacy.Tok2Vec.v2"

[components.morphologizer.model.tok2vec.embed]
@architectures = "SolipcysmeMultiHash"
width = ${components.morphologizer.model.tok2vec.encode.width}
features = ["NORM","PREFIX"]
u_features = ["jusqucy_ttypes","hunspell_po","hunspell_is"]
rows = [4000,1000,1000,1000,2000]
include_static_vectors = true

[components.morphologizer.model.tok2vec.encode]
@architectures = "spacy.MaxoutWindowEncoder.v2"
width = 256
depth = 4
window_size = 1
maxout_pieces = 3

[components.parser]
factory = "parser"
learn_tokens = false
min_action_freq = 30
moves = null
scorer = {"@scorers":"spacy.parser_scorer.v1"}
update_with_oracle_cut_size = 100

[components.parser.model]
@architectures = "spacy.TransitionBasedParser.v2"
state_type = "parser"
extra_state_tokens = false
hidden_width = 128
maxout_pieces = 3
use_upper = true
nO = null

[components.parser.model.tok2vec]
@architectures = "spacy.Tok2Vec.v2"

[components.parser.model.tok2vec.embed]
@architectures = "SolipcysmeMultiHash"
width = 128
features = ["NORM","POS","MORPH"]
u_features = []
rows = [4000,2000,4000]
include_static_vectors = true

[components.parser.model.tok2vec.encode]
@architectures = "spacy.MaxoutWindowEncoder.v2"
width = 128
depth = 4
window_size = 1
maxout_pieces = 3

[components.viceverser_lemmatizer]
factory = "viceverser_lemmatizer"
dic = {"@misc":"solipcysme_dic"}
aff = {"@misc":"solipcysme_aff"}

[initialize]
